; Lil Fella (2-bit classic virtual pet) for three Waveshare boards:
;   amoled216  ESP32-S3-Touch-AMOLED-2.16  (480x480 CO5300, CST9220 touch)        <- the default
;   amoled18   ESP32-S3-Touch-AMOLED-1.8   (368x448 CO5300/SH8601, CST816/FT3168 touch)
;   lcd183     ESP32-S3-Touch-LCD-1.83     (240x284 ST7789 SPI LCD, CST816 touch)
; All are an ESP32-S3R8 with 16 MB flash and 8 MB octal PSRAM. Pick one with `pio run -e <name>` (or the
; environment switcher in the VS Code status bar); a plain `pio run` builds the default.
; Uses pioarduino (Arduino-ESP32 3.x) because the audio path uses the ESP_I2S library.
[platformio]
default_envs = amoled216

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi   ; 8 MB octal PSRAM (ESP32-S3R8)
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLF_AUDIO=1          ; sound on (ES8311 codec + speaker). 0 leaves the audio code out of the build.
lib_deps =
    moononournation/GFX Library for Arduino @ ^1.6.4

[env:amoled216]
build_flags =
    ${env.build_flags}
    -DLF_BOARD_AMOLED216
lib_deps =
    ${env.lib_deps}
    lewisxhe/SensorLib @ 0.3.3   ; CST9220 touch driver (the version Waveshare's demo for this board uses)

[env:amoled18]
build_flags =
    ${env.build_flags}
    -DLF_BOARD_AMOLED18

[env:lcd183]
build_flags =
    ${env.build_flags}
    -DLF_BOARD_LCD183
